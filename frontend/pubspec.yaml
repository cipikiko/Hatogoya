name: testik
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  timezone: ^0.9.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  vibration: ^3.1.5
  permission_handler: ^11.3.1
  http: ^1.2.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  mobile_scanner: ^7.1.3
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter:

  uses-material-design: true
  assets:
    - lib/utils/images/
    - lib/utils/plants/
    - lib/game/assets/map.png

flutter_launcher_icons:
  android: true
  image_path: "lib/utils/images/titulna_fotka.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/utils/images/titulna_fotka.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"                                   #  biele pozadie
  image: lib/utils/images/titulna_fotka.png         #  tvoja veľká splash fotka
  android_gravity: fill                              # fullscreen
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: lib/utils/images/titulna_fotka.png
    fullscreen: true


